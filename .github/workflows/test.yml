name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # All apps pin the same @playwright/test version, so installing browsers
      # once from any single app's context covers the whole workspace.
      - run: pnpm --filter portfolio exec playwright install --with-deps

      # Private apps (apps/parlor, apps/facturation) are gitignored here and
      # live in their own repos — this checkout never has them, so `pnpm test`
      # only covers what's actually tracked in this repo. Each private app's
      # own repo has its own test.yml that reconstructs this workspace around
      # itself instead.
      - run: pnpm test
